<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOI Video Generator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#07111f;color:#eef6ff}.wrap{max-width:920px;margin:auto;padding:24px}.card{background:#0d1b2e;border:1px solid #233954;border-radius:20px;padding:20px;margin:14px 0}h1{margin:0;font-size:30px}.sub{color:#9db1c9;margin-top:5px}label{display:block;margin:13px 0 6px;font-weight:700}textarea,input,select{width:100%;padding:12px;border-radius:11px;border:1px solid #35506f;background:#081522;color:white}textarea{min-height:120px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{border:1px dashed #46678e;border-radius:12px;padding:10px}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;margin-top:8px;display:none}button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer;background:#e9f2ff;color:#07111f}.primary{width:100%;font-size:17px}.status{padding:12px;border-radius:10px;background:#081522;margin-top:12px;white-space:pre-wrap}video{width:100%;border-radius:14px;margin-top:12px}.small{font-size:12px;color:#8fa6bf}.brand{text-align:center;color:#91a7c0;margin-top:20px}@media(max-width:650px){.grid,.photos{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><h1>🎬 AI Video Generator</h1><div class="sub">Prompt + hingga 3 gambar referensi • by MOI Apps Studio</div>
<section class="card"><label>Prompt Video</label><textarea id="prompt" placeholder="Contoh: Buat video iklan produk sinematik, kamera bergerak perlahan..."></textarea>
<div class="grid"><div><label>Model</label><select id="model"><option value="dreamina-seedance-2-0-260128">Seedance 2.0</option><option value="dreamina-seedance-2-0-fast-260128">Seedance 2.0 Fast</option><option value="dreamina-seedance-1-5-pro-250528">Seedance 1.5 Pro</option><option value="dreamina-seedance-1-0-pro-250528">Seedance 1.0 Pro</option></select></div><div><label>Rasio</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option><option>3:4</option><option>adaptive</option></select></div><div><label>Durasi</label><select id="duration"><option value="5">5 detik</option><option value="8">8 detik</option><option value="10">10 detik</option><option value="12">12 detik</option></select></div><div><label>Resolusi</label><select id="resolution"><option>720p</option><option>1080p</option><option>480p</option></select></div></div>
<label>Gambar Referensi (maks. 3)</label><div class="photos" id="photos"></div><p class="small">Gambar dikirim sebagai data URL ke backend lalu ke Ark. Jika model menolak format/role tertentu, coba 1–2 gambar atau model Seedance 2.0.</p>
<label><input id="audio" type="checkbox" style="width:auto"> Generate audio (jika didukung model)</label><button class="primary" id="go">✨ GENERATE VIDEO</button><div class="status" id="status">Siap.</div></section>
<section class="card" id="result" hidden><b>Hasil Video</b><video id="video" controls></video><p><a id="open" target="_blank" rel="noopener" style="color:#b9d8ff">Buka video hasil</a></p></section><div class="brand">MOI Apps Studio</div></main>
<script>
const photos=document.getElementById('photos');
for(let i=1;i<=3;i++){const d=document.createElement('div');d.className='photo';d.innerHTML=`<b>Foto ${i}</b><input type="file" accept="image/*" data-i="${i}"><img>`;photos.appendChild(d);d.querySelector('input').onchange=e=>{const f=e.target.files[0],img=d.querySelector('img');if(f){img.src=URL.createObjectURL(f);img.style.display='block'}else img.style.display='none'}}
const fileToData=f=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function generate(){const btn=document.getElementById('go'),st=document.getElementById('status');const prompt=document.getElementById('prompt').value.trim();if(!prompt)return st.textContent='Prompt belum diisi.';btn.disabled=true;st.textContent='Mengirim task...';try{const content=[{type:'text',text:prompt}];for(const inp of document.querySelectorAll('input[type=file]')){if(inp.files[0])content.push({type:'image_url',image_url:{url:await fileToData(inp.files[0])},role:'reference_image'});}const body={model:model.value,content,ratio:ratio.value,duration:+duration.value,resolution:resolution.value,watermark:false,generate_audio:audio.checked};const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.error||data.message||JSON.stringify(data));if(!data.id)throw new Error('API tidak mengembalikan task ID. '+JSON.stringify(data));st.textContent='Task dibuat: '+data.id+'\nMenunggu proses video...';await poll(data.id);}catch(e){st.textContent='Gagal: '+e.message;btn.disabled=false}}
async function poll(id){const st=status,btn=go;for(let n=0;n<120;n++){await new Promise(r=>setTimeout(r,5000));const r=await fetch('/api/status?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok){st.textContent='Gagal cek status: '+(d.error?.message||d.message||JSON.stringify(d));btn.disabled=false;return}st.textContent='Task: '+id+'\nStatus: '+d.status;if(d.status==='succeeded'){const u=d.content?.video_url;if(!u){st.textContent+='\nSelesai tetapi video_url tidak ditemukan.';btn.disabled=false;return}video.src=u;open.href=u;result.hidden=false;st.textContent+='\n✅ Video selesai.';btn.disabled=false;return}if(['failed','cancelled','expired'].includes(d.status)){st.textContent+='\n'+JSON.stringify(d.error||d);btn.disabled=false;return}}st.textContent+='\nTimeout polling. Coba cek task lagi.';btn.disabled=false}
go.onclick=generate;
</script></body></html>
